# The installer is its own small crate so the main app's build and
# dependencies stay untouched. CI builds the app first, copies it to
# payload/wyvernscan, and this crate embeds it. The empty [workspace] keeps
# cargo from treating it as part of the root package. The egui/eframe
# versions and features match the app's, so the window looks and runs the same.
[package]
name = "wyvernscan-setup"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37.0"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] } # the native folder dialog for Browse; the app uses the same setup

# Build-time only, Windows hosts only: embeds assets/icon.ico into the .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
strip = true
