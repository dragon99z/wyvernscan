# The installer is its own tiny crate (std only) so the main app's build and
# dependencies stay untouched. CI builds the app first, copies it to
# payload/wyvernscan, and this crate embeds it. The empty [workspace] keeps
# cargo from treating it as part of the root package.
[package]
name = "wyvernscan-setup"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
