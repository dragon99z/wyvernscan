# Builds and tests WyvernScan on Windows, Linux and macOS, and keeps the
# resulting binaries (and the matching wyvernscan-setup installers) as
# downloadable artifacts. Push a tag like `v0.1.0` to also publish them as a
# GitHub Release.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `exe` is the release asset name and `setup` the matching installer asset
          # (Linux/macOS ones are named from `name` in their build steps).
          - name: windows-x86_64
            os: windows-latest
            exe: wyvernscan-windows-x86_64.exe
            setup: wyvernscan-setup-windows-x86_64.exe
          # arm64 is built natively on GitHub's arm64 runners (free for public
          # repos): cross-compiling a GUI app is not practical.
          - name: windows-arm64
            os: windows-11-arm
            exe: wyvernscan-windows-arm64.exe
            setup: wyvernscan-setup-windows-arm64.exe
          # An older Ubuntu on purpose: a binary built against an older glibc
          # also runs on newer distros, but not the other way round.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          # Already covers Apple Silicon (arm64) and Intel.
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1

      # The installer is a separate crate with its own target dir (and its own egui build).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            installer

      # The CLI banner and the self-updater both read the version from
      # Cargo.toml, so a tag on a commit that wasn't bumped ships a stale version.
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"

      - name: Test
        run: cargo test

      # --- Windows ---------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir dist installer/payload
          cp target/release/wyvernscan.exe dist/${{ matrix.exe }}
          # Installs from before the naming change look for exactly `wyvernscan.exe`
          # to self-update, so the x86_64 build is also published under that name.
          # Drop this once those installs have moved on.
          if [ "${{ matrix.name }}" = "windows-x86_64" ]; then cp target/release/wyvernscan.exe dist/wyvernscan.exe; fi
          # The installer embeds the app, so it is built right after it. (--release so
          # the tests reuse the dependencies the release build compiles anyway.)
          cp target/release/wyvernscan.exe installer/payload/wyvernscan
          cargo test --release --manifest-path installer/Cargo.toml
          cargo build --release --manifest-path installer/Cargo.toml
          cp installer/target/release/wyvernscan-setup.exe dist/${{ matrix.setup }}

      # --- Linux (x86_64 and aarch64) ---------------------------------------
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir dist installer/payload
          tar -czf dist/wyvernscan-${{ matrix.name }}.tar.gz -C target/release wyvernscan
          cp target/release/wyvernscan installer/payload/wyvernscan
          cargo test --release --manifest-path installer/Cargo.toml
          cargo build --release --manifest-path installer/Cargo.toml
          tar -czf dist/wyvernscan-setup-${{ matrix.name }}.tar.gz -C installer/target/release wyvernscan-setup

      # --- macOS: one universal binary for Apple Silicon and Intel ----------
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/wyvernscan \
            target/aarch64-apple-darwin/release/wyvernscan \
            target/x86_64-apple-darwin/release/wyvernscan
          tar -czf dist/wyvernscan-macos-universal.tar.gz -C dist wyvernscan
          mkdir installer/payload
          mv dist/wyvernscan installer/payload/wyvernscan
          # The installer is universal too, and carries the universal app.
          cargo test --release --manifest-path installer/Cargo.toml
          cargo build --release --manifest-path installer/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path installer/Cargo.toml --target x86_64-apple-darwin
          # Shipped as a double-clickable .app (zipped with ditto, which keeps bundles intact).
          app="installer/target/WyvernScan Setup.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp installer/macos/Info.plist "$app/Contents/Info.plist"
          sips -s format icns assets/icon-512.png --out "$app/Contents/Resources/icon.icns"
          lipo -create -output "$app/Contents/MacOS/wyvernscan-setup" \
            installer/target/aarch64-apple-darwin/release/wyvernscan-setup \
            installer/target/x86_64-apple-darwin/release/wyvernscan-setup
          ditto -c -k --keepParent "$app" dist/wyvernscan-setup-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wyvernscan-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
